appId: cn.deepwrite.desktop
productName: DeepWrite
artifactName: "${productName}-${version}-${os}-${arch}-test.${ext}"

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true
beforeBuild: ./scripts/electron-builder-before-build.cjs

extraMetadata:
  homepage: https://github.com/zhousiyi520/deepwrite
  desktopName: DeepWrite

publish:
  provider: generic
  url: https://github.com/zhousiyi520/deepwrite/releases/latest/download
  channel: latest

mac:
  target:
    - dmg
    - zip
  icon: build/icon.png
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: DeepWrite 使用麦克风录制语音，并通过您配置的语音服务转换为文字。

win:
  target: nsis
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  forceCodeSigning: false

linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Office
  executableName: deepwrite
  maintainer: carswj <wenjia@wenjiadeMacBook-Air.local>
  vendor: DeepWrite
  syncDesktopName: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DeepWrite
  deleteAppDataOnUninstall: false
